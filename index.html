<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7ff">
<title>QQ 快捷工具</title>
<style>
*{box-sizing:border-box}
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#20243a}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 15% 15%,rgba(124,108,255,.16),transparent 30%),radial-gradient(circle at 85% 85%,rgba(80,170,255,.14),transparent 30%),linear-gradient(135deg,#f8f9ff,#eef3ff)}
.wrap{width:min(100%,520px)}
.card{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 20px 60px rgba(60,70,130,.16);overflow:hidden}
.top{padding:34px 28px 22px;text-align:center}
.logo{width:66px;height:66px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;font-size:31px;background:linear-gradient(135deg,#776cff,#9d8cff);color:white;box-shadow:0 10px 25px rgba(119,108,255,.28)}
h1{font-size:25px;margin:0 0 8px;letter-spacing:.2px}.sub{margin:0;color:#73798f;font-size:14px}
.panel{padding:0 28px 30px}label{display:block;font-size:13px;font-weight:700;color:#5e6479;margin:4px 0 9px}
.inputbox{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 16px;background:#f5f6fb;border:1px solid #e5e7f0;border-radius:16px;transition:.2s}
.inputbox:focus-within{border-color:#8176ff;box-shadow:0 0 0 4px rgba(129,118,255,.1)}
.icon{font-size:20px}input{width:100%;border:0;outline:0;background:transparent;padding:13px 4px;font-size:17px;color:#252a40;min-width:0}
input::placeholder{color:#a2a7b8}.btn{width:100%;border:0;border-radius:15px;padding:14px 18px;margin-top:14px;font-size:16px;font-weight:700;cursor:pointer;color:white;background:linear-gradient(135deg,#756aff,#9587ff);box-shadow:0 9px 22px rgba(117,106,255,.25);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(1px);box-shadow:0 5px 14px rgba(117,106,255,.2)}.hint{min-height:22px;margin:13px 2px 0;text-align:center;font-size:13px;color:#777d91}
.tip{margin-top:20px;padding:14px 16px;border-radius:15px;background:#f7f7fc;color:#777d91;font-size:12px;line-height:1.7}.footer{text-align:center;color:#9aa0b1;font-size:11px;margin-top:16px}
@media(max-width:420px){body{padding:14px}.top{padding:28px 20px 18px}.panel{padding:0 20px 24px}.card{border-radius:23px}h1{font-size:23px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<header class="top"><div class="logo">Q</div><h1>QQ 快捷工具</h1><p class="sub">输入 QQ 号，快速打开对应资料卡</p></header>
<div class="panel">
<label for="uin">QQ 号码</label>
<div class="inputbox"><span class="icon">👤</span><input id="uin" value="3817304344" inputmode="numeric" autocomplete="off" placeholder="请输入 QQ 号"></div>
<button class="btn" onclick="openQQ()">打开 QQ 资料卡</button>
<p class="hint" id="msg">点击按钮后将尝试唤起 QQ</p>
<div class="tip">💡 如果点击后没有反应，可能是手机浏览器或当前 QQ 版本限制了 <code>mqq://</code> 应用跳转。</div>
</div>
</section>
<div class="footer">QQ 快捷工具 · Mobile</div>
</main>
<script>
function openQQ(){
 const uin=document.getElementById('uin').value.trim(),msg=document.getElementById('msg');
 if(!/^\d+$/.test(uin)){msg.textContent='请输入正确的 QQ 号';return;}
 const url='mqq://card/show_pslcard?src_type=internal&version=1'+'&uin='+encodeURIComponent(uin)+'&card_type=person&source=sharecard';
 msg.textContent='正在尝试打开 QQ…'; window.location.href=url;
}
</script>
</body>
</html>
