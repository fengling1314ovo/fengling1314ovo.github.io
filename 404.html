<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f7ff">
<title>404 - 枫铃工具箱</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;margin:0;padding:0;}
:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  --primary:#6366f1;
  --primary-light:#818cf8;
  --primary-bg:rgba(99,102,241,0.12);
  --text-main:#1e293b;
  --text-secondary:#64748b;
  --bg-card:rgba(255,255,255,0.9);
  --border-color:#e2e8f0;
}
body.dark{
  --text-main:#f1f5f9;
  --text-secondary:#94a3b8;
  --bg-card:rgba(30,41,59,0.9);
  --border-color:rgba(148,163,184,0.18);
}
body{
  min-height:100vh;
  background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.16),transparent 32%),
  radial-gradient(circle at 85% 85%,rgba(56,189,248,.12),transparent 32%),
  radial-gradient(circle at 50% 100%,rgba(168,85,247,.10),transparent 45%),
  linear-gradient(160deg,#f8faff 0%,#eef1ff 50%,#eaf6ff 100%);
  background-attachment:fixed;
  color:var(--text-main);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
body.dark{
  background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.18),transparent 32%),
  radial-gradient(circle at 85% 85%,rgba(56,189,248,.12),transparent 32%),
  linear-gradient(135deg,#0f172a,#1e293b);
}
.wrap{
  text-align:center;
  animation:popIn .4s ease;
}
@keyframes popIn{
  from{opacity:0;transform:scale(0.9) translateY(20px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
.code{
  font-size:120px;
  font-weight:800;
  line-height:1;
  background:linear-gradient(135deg,#6366f1,#38bdf8,#a855f7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:8px;
  letter-spacing:-4px;
}
.title{
  font-size:22px;
  font-weight:700;
  margin-bottom:8px;
}
.desc{
  font-size:14px;
  color:var(--text-secondary);
  line-height:1.7;
  margin-bottom:32px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 32px;
  border:none;
  border-radius:16px;
  background:#6366f1;
  color:#fff !important;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 4px 16px rgba(99,102,241,0.35);
  transition:transform .12s,box-shadow .12s;
}
.btn:active{
  transform:scale(0.96);
  box-shadow:0 2px 8px rgba(99,102,241,0.3);
}
.footer{
  margin-top:24px;
  font-size:12px;
  color:var(--text-secondary);
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="title">页面走丢了</div>
    <div class="desc">你访问的页面不存在或已被删除<br>请检查网址是否正确</div>
    <a href="https://fengling1314ovo.top" class="btn">🏠 返回首页</a>
    <div class="footer">枫铃工具箱 · 404</div>
  </div>
<script>
(function(){
  var dark=localStorage.getItem('qqtool_dark');
  if(dark==='1')document.body.classList.add('dark');
  var theme=localStorage.getItem('qqtool_theme');
  if(theme){
    document.querySelector('.code').style.background='linear-gradient(135deg,'+theme+',#38bdf8)';
    document.querySelector('.code').style.webkitBackgroundClip='text';
    document.querySelector('.code').style.webkitTextFillColor='transparent';
    document.querySelector('.btn').style.background=theme;
    document.querySelector('.btn').style.boxShadow='0 4px 16px '+theme+'55';
  }
})();
</script>
</body>
</html>
