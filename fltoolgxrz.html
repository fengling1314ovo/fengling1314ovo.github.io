<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f7ff">
<title>说明 - 枫铃工具箱</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  --primary:#6366f1;
  --primary-light:#818cf8;
  --primary-bg:rgba(99, 102, 241, 0.12);
  --text-main:#1e293b;
  --text-secondary:#64748b;
  --text-placeholder:#94a3b8;
  --bg-card:rgba(255,255,255,0.85);
  --bg-input:#f8fafc;
  --border-color:#e2e8f0;
}
body.dark{
  --text-main:#f1f5f9;
  --text-secondary:#94a3b8;
  --text-placeholder:#94a3b8;
  --bg-card:rgba(30,41,59,0.9);
  --bg-input:rgba(15,23,42,0.5);
  --border-color:rgba(148,163,184,0.18);
  background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.18),transparent 32%),
  radial-gradient(circle at 85% 85%,rgba(56,189,248,.12),transparent 32%),
  linear-gradient(135deg,#0f172a,#1e293b) !important;
}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.16),transparent 32%),
  radial-gradient(circle at 85% 85%,rgba(56,189,248,.12),transparent 32%),
  radial-gradient(circle at 50% 100%,rgba(168,85,247,.10),transparent 45%),
  linear-gradient(160deg,#f8faff 0%,#eef1ff 50%,#eaf6ff 100%);
  background-attachment:fixed;color:var(--text-main);transition:background .3s ease,color .3s ease;
}
.sticky-nav{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(248,250,255,0.72),rgba(248,250,255,0.52));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:16px 28px 12px;
  border-bottom:1px solid rgba(226,232,240,0.6);
  box-shadow:0 2px 12px rgba(30,41,59,0.04);
}
body.dark .sticky-nav{
  background:linear-gradient(180deg,rgba(15,23,42,0.72),rgba(15,23,42,0.52));
  border-bottom-color:rgba(148,163,184,0.15);
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.tool-header{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;}
.back-btn{
  border:none;background:var(--primary-bg);color:var(--primary);
  padding:7px 14px;border-radius:12px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;gap:6px;min-height:40px;transition:transform .12s;
}
.back-btn:active{transform:scale(0.96);}
.breadcrumb{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:4px;font-size:13px;color:var(--text-secondary);
}
.breadcrumb a{color:var(--primary);text-decoration:none;cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .15s;}
.breadcrumb a:hover{background:var(--primary-bg);}
.breadcrumb .sep{color:var(--text-placeholder);}
.breadcrumb .current{color:var(--text-main);font-weight:500;}
.content{max-width:900px;margin:0 auto;padding:16px 28px 32px;}
.common-block h3{margin:0 0 16px;font-size:20px;color:var(--text-main);}
.notice-card{
  padding:16px;border-radius:14px;background:var(--bg-input);
  border:1px solid var(--border-color);line-height:1.8;font-size:14px;
}
.notice-card .date{color:var(--primary);font-weight:600;margin-bottom:8px;}
.notice-card ul{margin:8px 0;padding-left:20px;}
.notice-card li{margin:4px 0;}
.notice-card .warn{color:var(--text-secondary);margin-top:10px;}
.notice-title{font-weight:600;margin:0 0 10px;font-size:15px;}
</style>
</head>
<body>
  <div class="sticky-nav">
    <div class="tool-header">
      <button class="back-btn" onclick="location.href='https://fengling1314ovo.top'"><span>←</span> 返回</button>
    </div>
    <div class="breadcrumb">
      <a href="工具箱.html">首页</a><span class="sep">/</span>
      <span class="current">说明</span>
    </div>
  </div>
  <div class="content">
    <div class="common-block">
      <h3>📖 枫铃工具箱说明</h3>
      <div class="notice-card">
        <div class="notice-title">📢 更新日志</div>
        <div class="date">9月27日 新增</div>
        <p style="margin:0 0 8px;">新增 4 个需要联网使用的工具箱：</p>
        <ul>
          <li>💱 汇率换算</li>
          <li>🌐 IP 查询</li>
          <li>🖥️ 查询服务器 IP</li>
          <li>☀️ 天气查询</li>
        </ul>
        <p class="warn">⚠️ 注意：以上功能并不会调用枫铃工具箱的服务器，而是调用其他公开服务器的 API，可以理解为这些功能使用的都是别人的服务器。</p>
      </div>
    </div>
  </div>
<script>
(function(){
  const dark = localStorage.getItem('qqtool_dark');
  if(dark === '1') document.body.classList.add('dark');
  const savedTheme = localStorage.getItem('qqtool_theme');
  if(savedTheme){
    try{
      const t = JSON.parse(savedTheme);
      if(t.p1){
        document.documentElement.style.setProperty('--primary', t.p1);
        // 从 hex 色生成 12% 透明度的 primary-bg
        const r = parseInt(t.p1.slice(1,3),16);
        const g = parseInt(t.p1.slice(3,5),16);
        const b = parseInt(t.p1.slice(5,7),16);
        document.documentElement.style.setProperty('--primary-bg', `rgba(${r},${g},${b},0.12)`);
      }
      if(t.p2){
        document.documentElement.style.setProperty('--primary-light', t.p2);
      }
    }catch(e){}
  }
})();
</script>
</body>
</html>
