<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打开 QQ 资料卡</title>
<style>
body{font-family:system-ui,sans-serif;text-align:center;padding:40px 20px}
input,button{font-size:18px;padding:12px;margin:8px;border-radius:10px}
button{cursor:pointer}
</style>
</head>
<body>
<h2>📱 打开 QQ 资料卡</h2>
<p>输入 QQ 号，然后点击按钮</p>
<input id="uin" value="10001" inputmode="numeric" placeholder="QQ号">
<br>
<button onclick="openQQ()">打开 QQ</button>
<p id="msg"></p>

<script>
function openQQ(){
  const uin = document.getElementById('uin').value.trim();
  if (!/^\d+$/.test(uin)) {
    document.getElementById('msg').textContent = '请输入正确的 QQ 号';
    return;
  }

  const url =
    'mqq://card/show_pslcard?src_type=internal&version=1' +
    '&uin=' + encodeURIComponent(uin) +
    '&card_type=person&source=sharecard';

  document.getElementById('msg').textContent = '正在尝试打开 QQ…';
  window.location.href = url;
}
</script>
</body>
</html>
